<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Turtle Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
<div id="loginOverlay" class="modal">
  <div class="modal-box">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2C8 2 5 5 5 9c0 3 2 5 2 5s-3 1-3 4c0 1.5 1.5 2 3 1.5.5 1.5 2 2.5 3.5 2s2-1.5 1.5-3c1.5.5 3-.5 3-2 0-1.5-1.5-2.5-1.5-2.5s3-1 3-5c0-4-3-7-5-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <h1>Turtle Search</h1>
    </div>
    <label>Password
      <input id="loginPassword" type="password" autocomplete="off" inputmode="text">
    </label>
    <div class="modal-actions">
      <button id="loginBtn">Enter</button>
    </div>
    <div id="loginStatus"></div>
  </div>
</div>

<div id="appRoot" class="hidden">
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2C8 2 5 5 5 9c0 3 2 5 2 5s-3 1-3 4c0 1.5 1.5 2 3 1.5.5 1.5 2 2.5 3.5 2s2-1.5 1.5-3c1.5.5 3-.5 3-2 0-1.5-1.5-2.5-1.5-2.5s3-1 3-5c0-4-3-7-5-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <h1>Turtle Search</h1>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" aria-label="Refresh data">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4v5h5M20 20v-5h-5M4.5 15a8 8 0 0 0 14.9 2.6M19.5 9A8 8 0 0 0 4.6 6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Refresh</span>
      </button>
      <div class="menu-wrap">
        <button id="menuBtn" aria-label="Open menu" aria-haspopup="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>
        </button>
        <div id="menuPanel" class="hidden" role="menu">
          <label>Spreadsheet link
            <input id="sheetUrl" type="text" placeholder="https://docs.google.com/spreadsheets/...">
          </label>
          <button id="saveSheetBtn">Save</button>
          <div id="menuStatus"></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="search-row">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchBox" type="text" placeholder="Search item name...">
    </div>
    <div id="meta" class="meta-row"></div>

    <div id="categoryRow" class="category-row"></div>

    <div id="cards" class="cards"></div>
  </main>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="/static/app.js?v=5"></script>
</body>
</html>
