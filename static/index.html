<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtle Search</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div id="loginOverlay" class="modal">
  <div class="modal-box">
    <h3>Turtle Search</h3>
    <label>Password
      <input id="loginPassword" type="password" autocomplete="off">
    </label>
    <div class="modal-actions">
      <button id="loginBtn">Enter</button>
    </div>
    <div id="loginStatus"></div>
  </div>
</div>

<div id="appRoot" class="hidden">
  <header>
    <h1>Turtle Search</h1>
    <button id="refreshBtn">Refresh</button>
  </header>

  <main>
    <div class="search-row">
      <input id="searchBox" type="text" placeholder="Search item name...">
      <span id="meta"></span>
    </div>

    <div id="categoryRow" class="category-row"></div>

    <div id="cards" class="cards"></div>
  </main>
</div>

<script src="/static/app.js?v=3"></script>
</body>
</html>
